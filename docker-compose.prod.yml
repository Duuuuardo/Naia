name: naia-prod

networks:
  novaplatform:
    external: true
  naia-internal:
    driver: bridge
    internal: true

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: naia
      POSTGRES_USER: naia
      POSTGRES_PASSWORD: ${NAIA_POSTGRES_PASSWORD}
    volumes:
      - naia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naia -d naia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naia-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${NAIA_REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - naia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NAIA_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naia-internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - naia_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naia-internal

  landing:
    image: ${REGISTRY}/naia-landing:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3301:3301"
    networks:
      novaplatform:
        aliases:
          - naia-landing
    environment:
      - PORT=3301
    env_file:
      - ./.env

  campaigns-api:
    image: ${REGISTRY}/naia-campaigns-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
    networks:
      novaplatform:
        aliases:
          - naia-campaigns-api
      naia-internal:
    env_file:
      - ./.env
    environment:
      - SESSION_HOST_BASE_URL=http://session-host-base:4010
      - SESSION_HOST_SCALE_URL=http://session-host-scale:4011
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  campaigns-web:
    image: ${REGISTRY}/naia-campaigns-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      novaplatform:
        aliases:
          - naia-campaigns-web
    environment:
      - PORT=3001
      - VIANOVA_API_INTERNAL_URL=http://vianova-api:5000
    env_file:
      - ./.env
    depends_on:
      - campaigns-api

  campaigns-worker:
    image: ${REGISTRY}/naia-campaigns-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - SESSION_HOST_BASE_URL=http://session-host-base:4010
      - SESSION_HOST_SCALE_URL=http://session-host-scale:4011
    networks:
      novaplatform:
      naia-internal:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  session-host-base:
    image: ${REGISTRY}/naia-campaigns-session-host:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - HOST_ID=base
      - PORT=4010
      - NAIA_SESSIONS_DIR=/data/sessions
      - NAIA_ALLOWED_ORIGINS=https://campaigns.naia.website
      - SESSION_HOST_BASE_URL=http://session-host-base:4010
      - SESSION_HOST_SCALE_URL=http://session-host-scale:4011
    volumes:
      - naia_session_base_data:/data/sessions
    networks:
      novaplatform:
      naia-internal:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  session-host-scale:
    image: ${REGISTRY}/naia-campaigns-session-host:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - HOST_ID=scale
      - PORT=4011
      - NAIA_SESSIONS_DIR=/data/sessions
      - NAIA_ALLOWED_ORIGINS=https://campaigns.naia.website
      - SESSION_HOST_BASE_URL=http://session-host-base:4010
      - SESSION_HOST_SCALE_URL=http://session-host-scale:4011
    volumes:
      - naia_session_scale_data:/data/sessions
    networks:
      novaplatform:
      naia-internal:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  naia_postgres_data:
  naia_redis_data:
  naia_minio_data:
  naia_session_base_data:
  naia_session_scale_data:
