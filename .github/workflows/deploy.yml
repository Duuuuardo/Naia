name: Deploy Naia

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-naia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: apps/landing
            image: naia-landing
          - app: campaigns/apps/api
            image: naia-campaigns-api
          - app: campaigns/apps/web
            image: naia-campaigns-web
          - app: campaigns/apps/worker
            image: naia-campaigns-worker
          - app: crm/apps/api
            image: naia-crm-api
          - app: crm/apps/web
            image: naia-crm-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/naia
            git pull
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -f
