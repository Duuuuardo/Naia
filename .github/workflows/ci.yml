name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: naia_test
          POSTGRES_USER: naia
          POSTGRES_PASSWORD: naia_secret
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U naia -d naia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAIA_TEST_DATABASE_URL: postgres://naia:naia_secret@localhost:5435/naia_test
      NAIA_TEST_REDIS_URL: redis://localhost:6381/7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - name: Typecheck all packages/apps
        run: |
          find apps packages campaigns/apps campaigns/packages -name package.json -not -path '*/node_modules/*' -print0 2>/dev/null |
          while IFS= read -r -d '' pkg; do
            dir=$(dirname "$pkg")
            if jq -e '.scripts.typecheck' "$pkg" >/dev/null 2>&1; then
              echo "==> typecheck $dir"
              (cd "$dir" && bun run typecheck)
            fi
          done
      - run: bun test
      - run: bun run build

  container-build:
    name: Container build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/landing
          - campaigns/apps/api
          - campaigns/apps/web
          - campaigns/apps/worker
          - campaigns/apps/session-host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --build-arg APP=${{ matrix.app }} --tag naia-ci:${{ github.sha }} .
      # SECURITY GATES (structure only — enable when tools are configured):
      # - name: Lint for hardcoded secrets
      #   run: bunx secretlint "**/*" || true
      # - name: Dependency audit
      #   run: bun audit
      # - name: Static security scan (Trivy/Snyk)
      #   run: |
      #     trivy filesystem --scanners vuln,secret,misconfig .
      #     # or snyk test
      # - name: Container image scan
