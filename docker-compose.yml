services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: naia
      POSTGRES_USER: naia
      POSTGRES_PASSWORD: ${NAIA_POSTGRES_PASSWORD}
    volumes:
      - naia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naia -d naia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    command: ["redis-server", "--requirepass", "${NAIA_REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - naia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NAIA_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  session-host-base:
    image: oven/bun:1.3.14
    restart: unless-stopped
    command: ["bun", "run", "--cwd", "campaigns/apps/session-host", "dev"]
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    ports:
      - "127.0.0.1:4010:4010"
    environment:
      - HOST_ID=base
      - PORT=4010
      - NAIA_DATABASE_URL=postgres://naia:${NAIA_POSTGRES_PASSWORD}@postgres:5432/naia
      - NAIA_REDIS_URL=redis://:${NAIA_REDIS_PASSWORD}@redis:6379
      - NAIA_S3_ENDPOINT=http://minio:9000
      - NAIA_S3_BUCKET=naia-campaigns
      - NAIA_S3_ACCESS_KEY=${NAIA_MINIO_ROOT_USER}
      - NAIA_S3_SECRET_KEY=${NAIA_MINIO_ROOT_PASSWORD}
      - NAIA_SESSIONS_DIR=/tmp/naia-sessions
      - SESSION_HOST_BASE_URL=http://session-host-base:4010
      - SESSION_HOST_SCALE_URL=http://session-host-scale:4011
      - NAIA_INTERNAL_SECRET=${NAIA_INTERNAL_SECRET}
    depends_on:
      - postgres
      - redis
      - minio

  session-host-scale:
    image: oven/bun:1.3.14
    restart: unless-stopped
    command: ["bun", "run", "--cwd", "campaigns/apps/session-host", "dev"]
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    ports:
      - "127.0.0.1:4011:4011"
    environment:
      - HOST_ID=scale
      - PORT=4011
      - NAIA_DATABASE_URL=postgres://naia:${NAIA_POSTGRES_PASSWORD}@postgres:5432/naia
      - NAIA_REDIS_URL=redis://:${NAIA_REDIS_PASSWORD}@redis:6379
      - NAIA_S3_ENDPOINT=http://minio:9000
      - NAIA_S3_BUCKET=naia-campaigns
      - NAIA_S3_ACCESS_KEY=${NAIA_MINIO_ROOT_USER}
      - NAIA_S3_SECRET_KEY=${NAIA_MINIO_ROOT_PASSWORD}
      - NAIA_SESSIONS_DIR=/tmp/naia-sessions
      - SESSION_HOST_BASE_URL=http://session-host-base:4010
      - SESSION_HOST_SCALE_URL=http://session-host-scale:4011
      - NAIA_INTERNAL_SECRET=${NAIA_INTERNAL_SECRET}
    depends_on:
      - postgres
      - redis
      - minio

  # Armazenamento de mídia das campanhas (imagens/vídeos/áudios/documentos).
  # Instância própria do Campaigns — o MinIO do Vianova é exclusivo de avatares.
  minio:
    image: minio/minio:RELEASE.2025-07-17T22-54-18Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9102:9000" # S3 API
      - "127.0.0.1:9103:9001" # Console
    environment:
      MINIO_ROOT_USER: ${NAIA_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${NAIA_MINIO_ROOT_PASSWORD}
      # CORS restrito aos domínios de dev/prod — nunca "*".
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3001,http://localhost:3301"
    volumes:
      - naia_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cria o bucket de mídia na primeira subida e encerra.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${NAIA_MINIO_ROOT_USER} ${NAIA_MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/naia-campaigns
      "

volumes:
  naia_postgres_data:
  naia_redis_data:
  naia_minio_data:
