services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: naia
      POSTGRES_USER: naia
      POSTGRES_PASSWORD: naia_secret
    volumes:
      - naia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naia -d naia"]
      interval: 5s
      timeout: 5s
      retries: 5

  crm_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_secret
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - naia_redis_data:/data

  session-host-base:
    image: oven/bun:1.3.14
    restart: unless-stopped
    command: ["bun", "run", "--cwd", "campaigns/apps/session-host", "dev"]
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    ports:
      - "4010:4010"
    environment:
      - HOST_ID=base
      - PORT=4010
      - NAIA_DATABASE_URL=postgres://naia:naia_secret@postgres:5432/naia
      - NAIA_REDIS_URL=redis://redis:6379
      - NAIA_S3_ENDPOINT=http://minio:9000
      - NAIA_S3_BUCKET=naia-campaigns
      - NAIA_S3_ACCESS_KEY=naia
      - NAIA_S3_SECRET_KEY=naia_secret_minio
      - NAIA_SESSIONS_DIR=/tmp/naia-sessions
      - SESSION_HOST_BASE_URL=http://session-host-base:4010
      - SESSION_HOST_SCALE_URL=http://session-host-scale:4011
      - NAIA_INTERNAL_SECRET=${NAIA_INTERNAL_SECRET}
    depends_on:
      - postgres
      - redis
      - minio

  session-host-scale:
    image: oven/bun:1.3.14
    restart: unless-stopped
    command: ["bun", "run", "--cwd", "campaigns/apps/session-host", "dev"]
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    ports:
      - "4011:4011"
    environment:
      - HOST_ID=scale
      - PORT=4011
      - NAIA_DATABASE_URL=postgres://naia:naia_secret@postgres:5432/naia
      - NAIA_REDIS_URL=redis://redis:6379
      - NAIA_S3_ENDPOINT=http://minio:9000
      - NAIA_S3_BUCKET=naia-campaigns
      - NAIA_S3_ACCESS_KEY=naia
      - NAIA_S3_SECRET_KEY=naia_secret_minio
      - NAIA_SESSIONS_DIR=/tmp/naia-sessions
      - SESSION_HOST_BASE_URL=http://session-host-base:4010
      - SESSION_HOST_SCALE_URL=http://session-host-scale:4011
      - NAIA_INTERNAL_SECRET=${NAIA_INTERNAL_SECRET}
    depends_on:
      - postgres
      - redis
      - minio

  # Armazenamento de mídia das campanhas (imagens/vídeos/áudios/documentos).
  # Instância própria do Campaigns — o MinIO do Vianova é exclusivo de avatares.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9102:9000" # S3 API
      - "9103:9001" # Console
    environment:
      MINIO_ROOT_USER: naia
      MINIO_ROOT_PASSWORD: naia_secret_minio
      # Presigned PUT direto do browser em dev
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - naia_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cria o bucket de mídia na primeira subida e encerra.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 naia naia_secret_minio &&
      mc mb --ignore-existing local/naia-campaigns
      "

volumes:
  naia_postgres_data:
  crm_postgres_data:
  naia_redis_data:
  naia_minio_data:
